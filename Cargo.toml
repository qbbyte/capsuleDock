[package]
name = "capsuledock"
version = "0.6.61"
edition = "2021"
license = "MIT"
description = "胶囊坞：Windows 顶部的桌面伙伴与信息坞"
repository = "https://github.com/qbbyte/capsuleDock"
default-run = "capsuledock"

[lib]
name = "capsuledock"
path = "src/lib.rs"

[[bin]]
name = "capsuledock"
path = "src/main.rs"

# 无窗口演示录制器：脚本驱动 + 软件光栅化，输出 RGBA 帧流给 ffmpeg。
[[bin]]
name = "capsuledock-record"
path = "src/bin/capsuledock-record/main.rs"
required-features = ["record"]

[features]
record = []

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg", "image"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "0.6"
regex = "1"
url = "2"
chrono = "0.4"

# Linux 下 winit 至少要一个后端才能编译（只用于开发/录制，正式目标是 Windows）。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
memmap2 = "0.9.12"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_TextServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics",
  "UI_Notifications_Management",
  "UI_Notifications", "ApplicationModel",
  "Win32_System_Ole", "Win32_UI_Shell_Common", "Networking_Connectivity",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth",
  "Devices_Bluetooth", "Devices_Enumeration",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
